name: Replay practice bug / 接管训练问题
description: Report a problem with this unofficial replay/autoplay practice build.
body:
  - type: markdown
    attributes:
      value: |
        This is an unofficial osu! Replay Practice branch. Report its problems here, not to ppy/osu.
        本仓库是非官方接管训练分支，请在这里反馈，不要向官方 osu! 仓库报告本分支的问题。
        Before attaching logs/replays, check for personal information. Do not upload account configuration or a full database.
        分享日志和回放前请检查个人信息；不需要上传账号配置或整个数据库。
  - type: input
    id: build
    attributes:
      label: Build / 测试包版本
      description: Package name from build-info.json, or the source commit.
    validations:
      required: true
  - type: dropdown
    id: baseline
    attributes:
      label: Replay source / 回放来源
      options:
        - Real replay / 真实回放
        - Autoplay (AT) / 自动基线
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include the selected time/object and whether you were watching, preparing, playing or paused.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour / 预期与实际表现
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: Mods and practice speed / Mods 与练习倍率
  - type: input
    id: display
    attributes:
      label: Window size, resolution and skin / 窗口尺寸、分辨率与皮肤
  - type: textarea
    id: attachments
    attributes:
      label: Optional logs, screenshots or video / 日志、截图或视频（可选）
      description: Share only the relevant information after checking privacy; no account files or full databases.
